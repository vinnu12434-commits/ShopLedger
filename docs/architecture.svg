<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture</title>
  <desc id="desc">Architecture diagram showing the browser UI, Express server, routes, business modules, configuration, JSON data store, and numbered order placement flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="flowArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font: 700 24px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 13px Arial, sans-serif; fill: #475569; }
      .section { font: 700 14px Arial, sans-serif; fill: #334155; }
      .label { font: 700 13px Arial, sans-serif; fill: #0f172a; }
      .small { font: 12px Arial, sans-serif; fill: #334155; }
      .tiny { font: 12px Arial, sans-serif; fill: #475569; }
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; rx: 8; }
      .group { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 12; }
      .ticket { fill: #fff1f2; stroke: #e11d48; stroke-width: 2; rx: 8; }
      .data { fill: #fefce8; stroke: #ca8a04; stroke-width: 1.5; rx: 8; }
      .flow { fill: none; stroke: #2563eb; stroke-width: 2.5; marker-end: url(#flowArrow); }
      .link { fill: none; stroke: #64748b; stroke-width: 1.5; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 5 4; marker-end: url(#arrow); }
      .num { fill: #2563eb; stroke: #ffffff; stroke-width: 2; }
      .numtext { font: 700 12px Arial, sans-serif; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <rect width="1200" height="800" fill="#ffffff"/>
  <text x="32" y="38" class="title">ShopLedger architecture</text>
  <text x="32" y="60" class="subtitle">Node/Express POS, Khata credit ledger, inventory and GST invoicing · verified against the workspace files</text>

  <!-- Browser -->
  <rect x="28" y="92" width="205" height="198" class="group"/>
  <text x="44" y="116" class="section">Browser UI · public/</text>
  <rect x="44" y="130" width="173" height="48" class="box"/>
  <text x="57" y="151" class="label">index.html</text>
  <text x="57" y="168" class="small">POS, orders, Khata, audit</text>
  <rect x="44" y="188" width="173" height="42" class="box"/>
  <text x="57" y="207" class="label">js/app.js</text>
  <text x="57" y="223" class="small">XHR API calls and rendering</text>
  <rect x="44" y="240" width="173" height="32" class="box"/>
  <text x="57" y="261" class="small">css/style.css</text>

  <!-- Server -->
  <rect x="270" y="92" width="190" height="198" class="group"/>
  <text x="286" y="116" class="section">Express entrypoint</text>
  <rect x="286" y="132" width="158" height="82" class="box"/>
  <text x="301" y="155" class="label">server.js</text>
  <text x="301" y="174" class="small">bodyParser.json()</text>
  <text x="301" y="191" class="small">express.static(public)</text>
  <text x="301" y="208" class="small">mounts /api routers</text>
  <rect x="286" y="228" width="158" height="42" class="box"/>
  <text x="301" y="247" class="small">GET /orders/:id/invoice</text>
  <text x="301" y="263" class="small">invoice.render(order)</text>

  <!-- Routes -->
  <rect x="495" y="92" width="220" height="300" class="group"/>
  <text x="511" y="116" class="section">HTTP routers · routes/</text>
  <rect x="511" y="130" width="188" height="52" class="box"/>
  <text x="525" y="151" class="label">products.js</text>
  <text x="525" y="169" class="small">/products · /coupons</text>
  <rect x="511" y="190" width="188" height="62" class="box"/>
  <text x="525" y="211" class="label">orders.js</text>
  <text x="525" y="229" class="small">GET/POST /orders</text>
  <text x="525" y="246" class="small">POST /orders/:id/cancel</text>
  <rect x="511" y="260" width="188" height="52" class="box"/>
  <text x="525" y="281" class="label">customers.js</text>
  <text x="525" y="299" class="small">/customers · /settle</text>
  <rect x="511" y="320" width="188" height="56" class="box"/>
  <text x="525" y="341" class="label">reports.js</text>
  <text x="525" y="359" class="small">dashboard · GST audit</text>
  <text x="525" y="374" class="small">pricing preview · export</text>

  <!-- Lib -->
  <rect x="750" y="92" width="420" height="450" class="group"/>
  <text x="766" y="116" class="section">Business modules · lib/</text>
  <rect x="766" y="130" width="122" height="58" class="box"/>
  <text x="780" y="153" class="label">store.js</text>
  <text x="780" y="171" class="small">read/write</text>
  <rect x="902" y="130" width="122" height="58" class="box"/>
  <text x="916" y="153" class="label">orders.js</text>
  <text x="916" y="171" class="small">add/get/list/cancel</text>
  <rect x="1038" y="130" width="116" height="58" class="box"/>
  <text x="1052" y="153" class="label">inventory.js</text>
  <text x="1052" y="171" class="small">stock checks</text>

  <rect x="766" y="204" width="122" height="58" class="box"/>
  <text x="780" y="227" class="label">pricing.js</text>
  <text x="780" y="245" class="small">computeTotals</text>
  <rect x="902" y="204" width="122" height="58" class="box"/>
  <text x="916" y="227" class="label">coupons.js</text>
  <text x="916" y="245" class="small">validate/discount</text>
  <rect x="1038" y="204" width="116" height="58" class="box"/>
  <text x="1052" y="227" class="label">ledger.js</text>
  <text x="1052" y="245" class="small">Khata balances</text>

  <rect x="766" y="278" width="122" height="58" class="box"/>
  <text x="780" y="301" class="label">reports.js</text>
  <text x="780" y="319" class="small">dashboard/audit</text>
  <rect x="902" y="278" width="122" height="58" class="ticket"/>
  <text x="916" y="301" class="label">invoice.js</text>
  <text x="916" y="319" class="small">render + figures</text>
  <rect x="1038" y="278" width="116" height="58" class="box"/>
  <text x="1052" y="301" class="label">tax.js</text>
  <text x="1052" y="319" class="small">GST rates/split</text>

  <rect x="766" y="352" width="122" height="58" class="box"/>
  <text x="780" y="375" class="label">dates.js</text>
  <text x="780" y="393" class="small">dates/FY</text>
  <rect x="902" y="352" width="122" height="58" class="box"/>
  <text x="916" y="375" class="label">config.js</text>
  <text x="916" y="393" class="small">shop/tax/coupons</text>
  <rect x="1038" y="352" width="116" height="58" class="box"/>
  <text x="1052" y="375" class="label">(shared)</text>
  <text x="1052" y="393" class="small">require('../config')</text>

  <text x="766" y="438" class="tiny">Ticket 1 focus: invoice.js must agree with checkout pricing.</text>
  <text x="766" y="457" class="tiny">tax.js is the shared GST helper if invoice logic is aligned to it.</text>

  <!-- Data -->
  <rect x="28" y="336" width="205" height="100" class="data"/>
  <text x="44" y="362" class="section">Persistent data</text>
  <text x="44" y="385" class="label">data/db.json</text>
  <text x="44" y="404" class="small">products, customers, orders</text>
  <text x="44" y="421" class="small">settlements, auditLog, counters</text>

  <!-- Supporting dependency links -->
  <path d="M233 190 L270 190" class="link"/>
  <path d="M460 190 L495 190" class="link"/>
  <path d="M715 190 L750 190" class="link"/>
  <path d="M460 250 C570 250 620 450 766 450" class="dash"/>
  <path d="M888 159 L902 159" class="link"/>
  <path d="M1024 233 L1038 233" class="link"/>
  <path d="M1024 307 L1038 307" class="link"/>
  <path d="M963 336 L963 352" class="link"/>
  <path d="M827 410 C827 470 650 480 233 400" class="dash"/>
  <text x="254" y="425" class="tiny">store.read / store.write</text>

  <!-- Numbered order flow -->
  <rect x="28" y="570" width="1142" height="184" class="group"/>
  <text x="44" y="596" class="section">Numbered flow: placing an order</text>

  <circle cx="64" cy="637" r="14" class="num"/><text x="64" y="637" class="numtext">1</text>
  <text x="86" y="633" class="label">public/js/app.js</text><text x="86" y="651" class="small">POST /api/orders</text>
  <path d="M190 637 L225 637" class="flow"/>

  <circle cx="245" cy="637" r="14" class="num"/><text x="245" y="637" class="numtext">2</text>
  <text x="267" y="633" class="label">routes/orders.js</text><text x="267" y="651" class="small">validate + resolve products</text>
  <path d="M392 637 L427 637" class="flow"/>

  <circle cx="447" cy="637" r="14" class="num"/><text x="447" y="637" class="numtext">3</text>
  <text x="469" y="633" class="label">inventory.check</text><text x="469" y="651" class="small">sellable stock</text>
  <path d="M570 637 L605 637" class="flow"/>

  <circle cx="625" cy="637" r="14" class="num"/><text x="625" y="637" class="numtext">4</text>
  <text x="647" y="633" class="label">pricing.computeTotals</text><text x="647" y="651" class="small">subtotal, coupon, GST</text>
  <path d="M793 637 L828 637" class="flow"/>

  <circle cx="848" cy="637" r="14" class="num"/><text x="848" y="637" class="numtext">5</text>
  <text x="870" y="633" class="label">ledger.chargeOrderToKhata</text><text x="870" y="651" class="small">only for khata</text>

  <path d="M848 665 L848 700 L730 700" class="flow"/>
  <circle cx="710" cy="700" r="14" class="num"/><text x="710" y="700" class="numtext">6</text>
  <text x="504" y="696" class="label">inventory.reserve → orders.add</text><text x="504" y="714" class="small">decrement stock and create order</text>
  <path d="M430 700 L395 700" class="flow"/>
  <circle cx="375" cy="700" r="14" class="num"/><text x="375" y="700" class="numtext">7</text>
  <text x="86" y="696" class="label">store.appendAudit → store.write</text><text x="86" y="714" class="small">save order, inventory, Khata and auditLog to data/db.json</text>

  <!-- Legend -->
  <rect x="1015" y="682" width="138" height="58" class="box"/>
  <text x="1027" y="700" class="label">Legend</text>
  <rect x="1027" y="708" width="16" height="12" class="ticket"/><text x="1050" y="719" class="tiny">Ticket 1</text>
  <rect x="1027" y="725" width="16" height="12" class="data"/><text x="1050" y="736" class="tiny">data store</text>
</svg>
